/* Layout: one notebook column. Menu of verb tiles, then a one-card-at-a-time drill with a thin progress bar.
   Colour: cool paper, ink blue, one red-pen accent for every mark. Highlighter yellow only for missing words. */
:root {
  --bg: #e9edf3;
  --card: #fbfcfe;
  --ink: #1b2540;
  --muted: #5a6683;
  --line: #c3cde2;
  --pen: #d23b35;
  --pen-soft: #f6dcda;
  --hl: #ffe27a;
  --ok: #23724f;
  --ok-soft: #d9efe4;
  --neon: #39ff14;
  --track: #1b2540;
  --btn: #1b2540;
  --btn-ink: #f4f6fb;
  --f-jp: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  --f-en: "Source Serif 4", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12182a; --card: #1b2440; --ink: #e8ecf6; --muted: #9aa6c4; --line: #34406a;
    --pen: #ff7a72; --pen-soft: #4a2a33; --hl: #6b5a14; --ok: #7fd6aa; --ok-soft: #1f4a3a; --neon: #39ff14; --track: #0b1020;
    --btn: #e8ecf6; --btn-ink: #14203a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12182a; --card: #1b2440; --ink: #e8ecf6; --muted: #9aa6c4; --line: #34406a;
  --pen: #ff7a72; --pen-soft: #4a2a33; --hl: #6b5a14; --ok: #7fd6aa; --ok-soft: #1f4a3a; --neon: #39ff14; --track: #0b1020;
  --btn: #e8ecf6; --btn-ink: #14203a; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-jp); font-size: 16px; line-height: 1.7;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.wrap > * { min-width: 0; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 1.25rem; font-weight: 700; margin: 0; letter-spacing: 0.03em; text-wrap: balance; }
h2 { font-size: 1.05rem; margin: 0; letter-spacing: 0.04em; }
p { margin: 0; }
main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

button {
  font-family: var(--f-jp); font-size: 1rem; font-weight: 700; border-radius: 4px; padding: 10px 20px; cursor: pointer;
  border: 1px solid var(--btn); background: var(--btn); color: var(--btn-ink); letter-spacing: 0.05em;
}
button.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 500; }
button.small { padding: 6px 12px; font-size: 0.85rem; }
button:hover { filter: brightness(1.1); }
button:disabled { cursor: default; }
button:focus-visible, summary:focus-visible, textarea:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 20px 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.tag { font-size: 0.78rem; letter-spacing: 0.08em; color: var(--muted); }
.label { font-size: 0.75rem; letter-spacing: 0.1em; color: var(--muted); }
.prompt { font-size: 1.25rem; font-weight: 500; line-height: 1.6; text-wrap: balance; }
.big { font-size: 1.15rem; font-weight: 500; line-height: 1.7; color: var(--ink); }
.pattern { font-family: var(--f-en); font-size: 1.35rem; font-weight: 600; overflow-wrap: anywhere; }
.en { font-family: var(--f-en); font-size: 1.3rem; line-height: 1.8; overflow-wrap: anywhere; }
.note { font-size: 0.88rem; color: var(--muted); }
.mine { font-size: 0.78rem; color: var(--muted); border-left: 3px solid var(--hl); padding-left: 8px; }
.warn { font-size: 0.9rem; border-left: 3px solid var(--pen); padding-left: 10px; }

/* progress */
.prog { display: flex; align-items: center; gap: 12px; font-size: 0.82rem; color: var(--muted); }
.bar { flex: 1; height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--neon); box-shadow: 0 0 8px var(--neon); border-radius: 4px; transition: width 0.3s ease; }
.prog b { color: var(--ink); font-variant-numeric: tabular-nums; }

/* menu */
.intro { display: flex; flex-direction: column; gap: 10px; }
.flow { display: flex; flex-wrap: wrap; gap: 4px 6px; font-size: 0.78rem; color: var(--muted); align-items: center; }
.flow span.s { border: 1px solid var(--line); border-radius: 3px; padding: 1px 8px; background: var(--bg); }
.section { display: flex; flex-direction: column; gap: 10px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile {
  text-align: left; background: var(--card); color: var(--ink); border: 1px solid var(--line); font-weight: 500;
  padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; letter-spacing: 0.02em; position: relative;
}
.tile:hover { filter: none; border-color: var(--ink); }
.tile .v { font-family: var(--f-en); font-size: 1.12rem; font-weight: 600; overflow-wrap: anywhere; }
.tile .p { font-size: 0.74rem; color: var(--muted); overflow-wrap: anywhere; line-height: 1.4; }
.tile .st { position: absolute; top: 8px; right: 10px; font-size: 0.72rem; font-weight: 700; }
.tile.done .st { color: var(--ok); }
.tile.miss { border-color: var(--pen); }
.tile.miss .st { color: var(--pen); }

/* options */
.opts { display: grid; gap: 8px; }
.opt {
  text-align: left; background: var(--card); color: var(--ink); border: 1px solid var(--line); font-weight: 500;
  padding: 10px 14px; letter-spacing: 0.02em; overflow-wrap: anywhere;
}
.opt.en { font-family: var(--f-en); font-size: 1.1rem; }
.opt:hover:not(:disabled) { border-color: var(--ink); filter: none; }
.opt.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ink); }
.opt.ng { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--pen); text-decoration-thickness: 2px; opacity: 0.7; }
.blank { display: inline-block; min-width: 3.4em; border-bottom: 2px solid var(--pen); text-align: center; color: var(--pen); }
.blank.filled { color: var(--ok); border-color: var(--ok); font-weight: 600; }

/* verb button & scene */
.verbbtn {
  align-self: flex-start; background: var(--card); color: var(--ink); border: 2px solid var(--ink); border-radius: 8px;
  font-family: var(--f-en); font-size: 2rem; font-weight: 600; padding: 8px 22px; letter-spacing: 0.02em; overflow-wrap: anywhere; text-align: left;
}
.verbbtn small { display: block; font-family: var(--f-jp); font-size: 0.72rem; font-weight: 500; color: var(--muted); letter-spacing: 0.08em; }
.scenebox { display: flex; flex-direction: column; gap: 6px; }
.scene { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
.scene svg { display: block; width: 100%; height: auto; }
.cap { font-size: 0.85rem; color: var(--muted); }
.scene .ground { stroke: var(--line); stroke-width: 2; }
.scene .ln { stroke: var(--ink); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.scene .ln.fb { fill: var(--card); }
.scene .ln.hl { fill: var(--hl); }
.scene .acc { fill: var(--pen); stroke: none; }
.scene .accl { stroke: var(--pen); stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.scene .dash { stroke: var(--line); stroke-width: 2.5; stroke-dasharray: 5 6; fill: none; }
.scene .tx { font: 700 15px var(--f-jp); fill: var(--pen); }
.scene .tx2 { font: 500 12px var(--f-jp); fill: var(--ink); }
.scene .h { opacity: 0; }
.scene .a-pop { transform-box: fill-box; transform-origin: center; }
.scene.play .a-mvx { animation: mvx var(--t, 1s) var(--d, 0s) ease-in-out both; }
.scene.play .a-pop { animation: pop 0.4s var(--d, 0s) ease-out both; }
.scene.play .a-hop { animation: hop 0.9s var(--d, 0s) ease-in-out both; }
.scene.play .a-arc { animation: arc var(--t, 1.4s) var(--d, 0s) ease-in-out both; }
.scene.play .a-drop { animation: drop 0.4s var(--d, 0s) ease-in both; }
.scene.play .a-coin { animation: coin 1.1s var(--d, 0s) ease-in both; }
.scene.play .a-ob { animation: outback 1.6s var(--d, 0s) ease-in-out both; }
.scene.play .a-climb { animation: climb 2.4s var(--d, 0s) ease-in-out both; }
.scene.play .a-lead { animation: lead 2.4s var(--d, 0s) ease-in-out both; }
@keyframes mvx { from { transform: translateX(0); } to { transform: translateX(var(--dx)); } }
@keyframes pop { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }
@keyframes hop { 0%, 100% { transform: translateY(0); } 25%, 75% { transform: translateY(-9px); } 50% { transform: translateY(0); } }
@keyframes arc { 0% { transform: translate(0, 0); } 50% { transform: translate(calc(var(--dx) / 2), -42px); } 100% { transform: translate(var(--dx), 0); } }
@keyframes drop { from { opacity: 0; transform: translateY(-80px); } to { opacity: 1; transform: translateY(0); } }
@keyframes coin { 0% { opacity: 0; transform: translate(0, 0); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), -36px); } }
@keyframes outback { 0% { transform: translate(0, 0); } 40%, 55% { transform: translate(var(--dx), -22px); } 100% { transform: translate(0, 0); } }
@keyframes climb { 0% { transform: translate(0, 0); } 30% { transform: translate(70px, 0); } 45% { transform: translate(100px, -22px); } 60% { transform: translate(125px, -22px); } 75% { transform: translate(145px, -44px); } 100% { transform: translate(180px, -44px); } }
@keyframes lead { 0% { transform: translate(0, 0); } 35% { transform: translate(90px, 0); } 70% { transform: translate(170px, -25px); } 100% { transform: translate(240px, -45px); } }

/* arrange */
.ansline { min-height: 58px; border-bottom: 2px dashed var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 6px 0; }
.ansline .ph { color: var(--muted); font-size: 0.85rem; }
.sep { color: var(--muted); }
.bank { display: flex; flex-wrap: wrap; gap: 8px; min-height: 46px; }
.chip {
  background: var(--card); color: var(--ink); border: 1px solid var(--ink); border-radius: 4px; padding: 7px 12px;
  font-family: var(--f-en); font-size: 1.1rem; font-weight: 500; letter-spacing: 0; cursor: pointer; overflow-wrap: anywhere; text-align: left;
}
.chip.jp { font-family: var(--f-jp); font-size: 1rem; }
.chip.placed { background: var(--bg); }
.chip.ok { border-color: var(--ok); background: var(--ok-soft); }
.chip.ng { border-color: var(--pen); background: var(--pen-soft); }
.chip:hover { filter: none; }

/* write */
textarea.ans {
  width: 100%; display: block; resize: none; border: 0; border-bottom: 1px solid var(--line); background-color: transparent;
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 43px, var(--line) 43px, var(--line) 44px);
  background-attachment: local; color: var(--ink); font-family: var(--f-en); font-size: 1.3rem; line-height: 44px; padding: 0 2px; height: 132px; border-radius: 0;
}
textarea.ans:disabled { opacity: 0.75; }
.hints { display: flex; flex-direction: column; gap: 10px; }
.hint { display: flex; flex-direction: column; gap: 4px; border-left: 3px solid var(--line); padding-left: 10px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font-family: var(--f-en); border: 1px solid var(--line); border-radius: 4px; padding: 2px 10px; background: var(--bg); }
.msg { font-size: 0.85rem; color: var(--pen); min-height: 1.3em; }

.result { display: flex; flex-direction: column; gap: 12px; border-top: 1px dashed var(--line); padding-top: 14px; }
.verdict { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.stamp { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 110px; height: 52px; font-weight: 700; font-size: 1.1rem; color: var(--pen); }
.stamp svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.stamp ellipse { fill: none; stroke: var(--pen); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 0.45s ease-out; }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
.stamp.plain { text-decoration: underline wavy var(--pen); text-underline-offset: 6px; }
.w.bad { color: var(--pen); text-decoration: line-through; text-decoration-thickness: 2px; }
.w.near { text-decoration: underline wavy var(--pen); text-underline-offset: 5px; }
.w.miss { background: var(--hl); border-radius: 2px; padding: 0 2px; }

.steps { display: flex; flex-direction: column; gap: 6px; }
.reveal { border-left: 3px solid var(--pen); padding-left: 12px; display: flex; flex-direction: column; gap: 2px; }
.arrow { color: var(--pen); font-weight: 700; }

.list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.list li { border-top: 1px dashed var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 2px; }
.nb { border: 1px solid var(--pen); border-radius: 6px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; background: var(--card); }
.nb .nbt { font-family: var(--f-en); font-size: 1.2rem; font-weight: 600; }

details { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 12px 16px; }
summary { cursor: pointer; font-weight: 700; font-size: 0.95rem; }
details .body { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; font-size: 0.9rem; }

@media (max-width: 480px) {
  .prompt { font-size: 1.12rem; }
  .en, textarea.ans { font-size: 1.15rem; }
  .card { padding: 16px 14px; }
  .verbbtn { font-size: 1.7rem; }
}
@media (prefers-reduced-motion: reduce) {
  .scene.play [class*="a-"] { animation-duration: 0.01s !important; animation-delay: 0s !important; }
  .stamp ellipse { animation: none; }
  .bar > i { transition: none; }
}
</style>

    function check() {
      if (!norm(ta.value)) { msg.textContent = '英語を書いてから答え合わせしてください。'; return; }
      msg.textContent = '';
      var r = judgeMulti(ta.value, st.accept);
      var good = r.kind === 'ok' || (st.loose && r.kind === 'close');
      if (good) playSuccessChime(false);
      if (!good) ctx.miss();
      ta.disabled = true; row.hidden = true; resultBox.textContent = '';
      var box = el('div', 'result'), v = el('div', 'verdict');
      var stamp = el('span', good ? 'stamp' : 'stamp plain');
      if (good) {
        var ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg'), ell = document.createElementNS(ns, 'ellipse');
        svg.setAttribute('viewBox', '0 0 110 52'); svg.setAttribute('aria-hidden', 'true');
        ell.setAttribute('cx', '55'); ell.setAttribute('cy', '26'); ell.setAttribute('rx', '51'); ell.setAttribute('ry', '21'); ell.setAttribute('pathLength', '1');
        svg.appendChild(ell); stamp.appendChild(svg);
      }
      stamp.appendChild(el('span', null, good ? '正解' : r.kind === 'close' ? 'おしい' : 'もう一度'));
      v.appendChild(stamp);
      v.appendChild(el('p', 'note', good ? '' : r.kind === 'close' ? '単語は合っています。大文字・ピリオドを確認しましょう。' : '線を引いた部分が違うところ、黄色が足りなかった語です。'));
      box.appendChild(v);
      if (!good) { box.appendChild(el('p', 'label', 'あなたの答え')); box.appendChild(marksNode(r.u)); }
      box.appendChild(el('p', 'label', '正解')); box.appendChild(marksNode(r.m));
      if (!good) {
        var again = btn('もう一度書く', 'ghost', function () { ta.disabled = false; row.hidden = false; resultBox.textContent = ''; ta.focus(); });
        var rr = el('div', 'row'); rr.appendChild(again); box.appendChild(rr);
        box.appendChild(el('p', 'note', '正しく書けるまで、次へは進めません。'));
      }
      resultBox.appendChild(box);
      if (good) ctx.complete();
    }
    checkBtn.addEventListener('click', check);
    ta.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); check(); } });
    drawHints();
  };

  BUILD.reveal = function (st, card, ctx) {
    var list = el('div', 'steps'), n = 0;
    var more = btn('つぎを見る', null);
    function add() {
      var s = st.steps[n++], r = el('div', 'reveal');
      r.appendChild(el('p', 'label', s.l)); r.appendChild(el('p', 'en', s.x));
      list.appendChild(r);
      if (n >= st.steps.length) { more.hidden = true; ctx.complete(); }
    }
    card.appendChild(el('p', 'prompt', 'いきなり変換せず、順番に見ていこう'));
    card.appendChild(list); card.appendChild(more);
    more.addEventListener('click', add);
    add();
  };

  /* ---------- menu & end ---------- */
  function tile(id) {
    var u = UNITS[id], t = el('button', 'tile'); t.type = 'button';
    var miss = prog.missed[id], done = prog.done[id];
    if (miss) t.classList.add('miss'); else if (done) t.classList.add('done');
    t.appendChild(el('span', 'v', u.label)); t.appendChild(el('span', 'p', u.sub));
    if (miss) t.appendChild(el('span', 'st', '要復習')); else if (done) t.appendChild(el('span', 'st', '✓'));
    t.addEventListener('click', function () { startRun([id]); });
    return t;
  }
  function section(title, note, ids) {
    var s = el('section', 'section');
    s.appendChild(el('h2', null, title));
    if (note) s.appendChild(el('p', 'note', note));
    var g = el('div', 'tiles'); ids.forEach(function (id) { g.appendChild(tile(id)); });
    s.appendChild(g); return s;
  }
  function renderMenu() {
    var intro = el('div', 'card intro');
    intro.appendChild(el('p', 'prompt', '絵で意味をつかむ → 10秒チャレンジ → 必要なところだけ練習！'));
    intro.appendChild(el('p', 'note', 'できる問題はすぐクリア。むずかしい問題だけ、ゆっくり練習します。'));
    var flow = el('div', 'flow');
    ['👀 絵で見る', '💡 意味', '⚡ 10秒', '🧩 並べる', '✏️ 穴埋め', '✅ 完成', '📄 プリント'].forEach(function (t, i, a) {
      flow.appendChild(el('span', 's', t)); if (i < a.length - 1) flow.appendChild(el('span', null, '→'));
    });
    intro.appendChild(flow);
    var miss = Object.keys(prog.missed);
    if (miss.length) {
      var row = el('div', 'row');
      row.appendChild(btn('間違えた構文だけ再練習(' + miss.length + ')', null, function () { startRun(miss); }));
      intro.appendChild(row);
    }
    app.appendChild(intro);
    app.appendChild(section('🖼️ A　無生物主語', 'STEP 3の10秒チャレンジを1回でクリアできれば、その動詞は即クリア。必要なときだけ段階練習に進みます。', GROUPS.filter(function (g) { return g.core; }).map(function (g) { return g.id; })));
    app.appendChild(section('➕ A　追加で扱う表現', '', GROUPS.filter(function (g) { return !g.core; }).map(function (g) { return g.id; })));
    app.appendChild(section('🧩 B　名詞構文', 'いきなり変換しません。説明 → 型ごとの短い練習で進みます。', ['n_take', 'n_make', 'n_give', 'n_good', 'n_poss', 'n_of']));
    app.appendChild(section('🎯 まとめ問題', '', ['ex1', 'wayaku', 'seiretsu', 'write']));
    var d = el('details'); d.appendChild(el('summary', null, '紙のプリントとの使い分け'));
    var b = el('div', 'body');
    ['アプリで、Lesson 35を複数回練習する。', '紙の確認プリントを解く。', '間違えた構文だけ、アプリで再練習する。', 'それでもできない構文は、動詞・意味・型・例文をノートに書いて覚える(2〜3回)。'].forEach(function (t, i) { b.appendChild(el('p', null, (i + 1) + '.　' + t)); });
    var rs = btn('学習の記録を消す', 'ghost small', function () { prog = { done: {}, missed: {} }; saveProg(); render(); });
    b.appendChild(rs); d.appendChild(b); app.appendChild(d);
  }
  function renderEnd() {
    var card = el('section', 'card');
    card.appendChild(el('h2', null, 'おつかれさまでした'));
    var ul = el('ul', 'list'), missedIds = [];
    run.gids.forEach(function (gid) {
      var m = run.miss[gid] || 0, li = el('li');
      li.appendChild(el('p', 'big', UNITS[gid].label));
      li.appendChild(el('p', 'note', run.fast[gid] ? '⚡ 10秒マスターチャレンジで即クリアしました。' : (m ? 'つまずいた問題: ' + m + ' 問' : 'ぜんぶ、1回で正解しました。')));
      ul.appendChild(li);
      if (m) { missedIds.push(gid); prog.missed[gid] = (prog.missed[gid] || 0) + m; delete prog.done[gid]; }
      else { prog.done[gid] = 1; delete prog.missed[gid]; }
    });
    saveProg();
    card.appendChild(ul);
    missedIds.forEach(function (gid) {
      var g = GMAP[gid];
      if (!g) return;
      var nb = el('div', 'nb');
      nb.appendChild(el('p', 'label', 'ノートに書こう(2〜3回)'));
      nb.appendChild(el('p', 'nbt', g.label));
      nb.appendChild(el('p', null, '意味:　' + g.mean));
      nb.appendChild(el('p', null, '型:　' + g.pattern));
      nb.appendChild(el('p', 'en', '例文:　' + g.sents[0].en));
      card.appendChild(nb);
    });
    card.appendChild(el('p', 'note', 'iPadで何回か練習したら、紙のプリントで確認しよう。間違えた構文だけ、またここで練習できます。'));
    var row = el('div', 'row');
    if (missedIds.length) row.appendChild(btn('間違えた構文だけもう一度', null, function () { startRun(missedIds); }));
    row.appendChild(btn('メニューへ', missedIds.length ? 'ghost' : null, goHome));
    card.appendChild(row);
    run.i = run.stages.length;
    app.appendChild(card);
  }

  render();
  window.__L35 = { GROUPS: GROUPS, startRun: startRun, UNITS: UNITS, findTok: findTok };
})();
</script>
